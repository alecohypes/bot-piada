<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testador de Bots</title>
<style>
  :root {
    --bg: #f4f5f8; --painel: #ffffff; --borda: #e2e5ec; --texto: #1d2230; --suave: #687089;
    --primaria: #4f46e5; --primaria-suave: #eef0ff; --voce: #4f46e5; --voce-texto: #fff;
    --bolha: #f1f3f7; --aviso: #fff6e0; --aviso-texto: #7a5500;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141b; --painel: #1b1e28; --borda: #2b2f3d; --texto: #e7e9f0; --suave: #9aa1b6;
      --primaria: #8b85ff; --primaria-suave: #262a45; --voce: #5b54e8; --voce-texto: #fff;
      --bolha: #252937; --aviso: #3a3015; --aviso-texto: #f3d38a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--texto); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--borda); background: var(--painel);
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header span { color: var(--suave); font-size: 13px; }
  .app { flex: 1; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--borda); background: var(--painel); overflow-y: auto; padding: 12px; }
  .etapa { width: 100%; text-align: left; border: 1px solid transparent; background: none; color: inherit;
           font: inherit; padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
  .etapa:hover { background: var(--bolha); }
  .etapa.ativa { background: var(--primaria-suave); border-color: var(--primaria); }
  .etapa b { display: block; }
  .etapa small { color: var(--suave); display: block; }
  .chips-bots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; color: #fff; font-weight: 600; }
  main { display: flex; flex-direction: column; min-height: 0; }
  .info { padding: 12px 20px; border-bottom: 1px solid var(--borda); font-size: 13px; color: var(--suave); }
  .info code { background: var(--bolha); padding: 1px 5px; border-radius: 4px; color: var(--texto); }
  #conversa { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.voce { align-self: flex-end; background: var(--voce); color: var(--voce-texto); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bolha); border-bottom-left-radius: 4px; }
  .msg.bot .quem { font-size: 12px; font-weight: 700; margin-bottom: 2px; display: flex; gap: 6px; align-items: center; }
  .msg.bot .quem em { font-style: normal; font-weight: 500; color: var(--suave); }
  .msg.aviso { align-self: center; background: var(--aviso); color: var(--aviso-texto); font-size: 13px; }
  .vazio { margin: auto; text-align: center; color: var(--suave); max-width: 380px; }
  .sugestoes { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 10px; }
  .sugestoes button { border: 1px solid var(--borda); background: var(--painel); color: inherit; font: inherit;
                      font-size: 13px; padding: 4px 10px; border-radius: 99px; cursor: pointer; }
  .sugestoes button:hover { border-color: var(--primaria); color: var(--primaria); }
  form { display: flex; gap: 8px; padding: 12px 20px 18px; border-top: 1px solid var(--borda); background: var(--painel); }
  input { flex: 1; font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--borda);
          background: var(--bg); color: inherit; outline: none; }
  input:focus { border-color: var(--primaria); }
  form button { font: inherit; font-weight: 600; padding: 0 18px; border: 0; border-radius: 10px;
                background: var(--primaria); color: #fff; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: wait; }
  .limpar { margin-left: auto; font: inherit; font-size: 13px; background: none; border: 1px solid var(--borda);
            color: var(--suave); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--borda); display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
    .etapa { min-width: 170px; margin: 0; }
    .etapa small { display: none; }
    .msg { max-width: 90%; }
    #conversa, .info, form, .sugestoes { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Testador de Bots</h1>
  <span>Chatbot POO — todas as etapas em um só lugar. As respostas vêm do <code>Main.java</code> real de cada pasta.</span>
  <button class="limpar" id="limpar" type="button">Limpar conversa</button>
</header>
<div class="app">
  <aside id="etapas"></aside>
  <main>
    <div class="info" id="info"></div>
    <div id="conversa"></div>
    <div class="sugestoes" id="sugestoes"></div>
    <form id="form">
      <input id="entrada" autocomplete="off" placeholder="Digite uma mensagem…" autofocus>
      <button id="enviar">Enviar</button>
    </form>
  </main>
</div>

<script>
const ETAPAS = [
  { id: "todas", titulo: "Todas as etapas", desc: "Manda a mesma mensagem para todos os bots de todas as pastas.",
    bots: ["Bia", "Max", "Juca", "Zeca", "Fabi", "Téo"],
    info: "Cada mensagem é enviada para <code>aula</code>, <code>atividade2</code>, <code>atividade3</code> e <code>atividade4</code> ao mesmo tempo.",
    sugestoes: ["oi", "que horas são?", "quando é a prova?", "nota", "converter 5 km", "piada", "elogio", "biblioteca", "secretaria"] },
  { id: "aula", titulo: "Aula", desc: "Projeto base", bots: ["Bia", "Max"],
    info: "<b>Bia</b> (<code>ChatBot extends Bot</code>) e <b>Max</b> (<code>AgenteIA</code> com as ferramentas <code>Agenda</code> e <code>Relogio</code>).",
    sugestoes: ["oi", "aula", "que horas são?", "quando é a prova?", "qual a hora da prova?", "sair"] },
  { id: "atividade2", titulo: "Atividade 2", desc: "Fácil, Médio e Desafio", bots: ["Bia", "Max", "Juca"],
    info: "Fácil: Bia responde <code>nota</code>. Médio: ferramenta <code>Conversor</code> (km → m). Desafio: <b>Juca</b> (<code>BotPiada</code>).",
    sugestoes: ["nota", "converter 5 km", "converter 2,5 km", "piada", "que horas são?", "oi"] },
  { id: "atividade3", titulo: "Atividade 3", desc: "Show de Bots", bots: ["Zeca"],
    info: "<b>Zeca</b> é um <code>AgenteIA</code> com as habilidades <code>Piada</code> e <code>Elogio</code> (respostas aleatórias).",
    sugestoes: ["piada", "elogio", "oi"] },
  { id: "atividade4", titulo: "Atividade 4", desc: "Assistente da Fametro", bots: ["Fabi", "Téo"],
    info: "<b>Fabi</b> (<code>AgenteIA</code> com <code>Biblioteca</code> e <code>Secretaria</code>) e <b>Téo</b> (<code>BotBoasVindas</code>).",
    sugestoes: ["biblioteca", "secretaria", "oi"] },
];
const PASTAS = ["aula", "atividade2", "atividade3", "atividade4"];
const NOME_PASTA = { aula: "Aula", atividade2: "Atividade 2", atividade3: "Atividade 3", atividade4: "Atividade 4" };
const CORES = { Bia: "#db2777", Max: "#2563eb", Juca: "#d97706", Zeca: "#059669", Fabi: "#7c3aed", "Téo": "#0891b2" };
const cor = nome => CORES[nome] || "#64748b";

const $ = id => document.getElementById(id);
let atual = "todas";
const historico = {};   // conversa separada por etapa

function el(tag, classe, texto) {
  const e = document.createElement(tag);
  if (classe) e.className = classe;
  if (texto != null) e.textContent = texto;
  return e;
}

function montarEtapas() {
  $("etapas").innerHTML = "";
  for (const et of ETAPAS) {
    const b = el("button", "etapa" + (et.id === atual ? " ativa" : ""));
    b.type = "button";
    b.append(el("b", null, et.titulo), el("small", null, et.desc));
    const chips = el("div", "chips-bots");
    for (const nome of et.bots) {
      const t = el("span", "tag", nome);
      t.style.background = cor(nome);
      chips.append(t);
    }
    b.append(chips);
    b.onclick = () => { atual = et.id; montarEtapas(); mostrar(); $("entrada").focus(); };
    $("etapas").append(b);
  }
}

function mostrar() {
  const et = ETAPAS.find(e => e.id === atual);
  $("info").innerHTML = et.info;
  $("sugestoes").innerHTML = "";
  for (const s of et.sugestoes) {
    const b = el("button", null, s);
    b.type = "button";
    b.onclick = () => enviar(s);
    $("sugestoes").append(b);
  }
  const conversa = $("conversa");
  conversa.innerHTML = "";
  const itens = historico[atual] || [];
  if (!itens.length) {
    conversa.append(el("div", "vazio", "Mande uma mensagem ou clique numa sugestão abaixo. Cada bot vai responder do seu jeito — isso é polimorfismo!"));
  }
  for (const item of itens) conversa.append(renderizar(item));
  conversa.scrollTop = conversa.scrollHeight;
}

function renderizar(item) {
  if (item.tipo === "voce") return el("div", "msg voce", item.texto);
  if (item.tipo === "aviso") return el("div", "msg aviso", item.texto);
  const d = el("div", "msg bot");
  const quem = el("div", "quem");
  const nome = el("span", null, item.bot);
  nome.style.color = cor(item.bot);
  quem.append(nome);
  if (item.pasta) quem.append(el("em", null, "· " + NOME_PASTA[item.pasta]));
  d.append(quem, document.createTextNode(item.texto));
  return d;
}

function adicionar(etapa, item) {
  (historico[etapa] ||= []).push(item);
  if (etapa === atual) mostrar();
}

async function perguntar(pasta, mensagem) {
  const r = await fetch("/api/chat?etapa=" + pasta, { method: "POST", body: mensagem });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function enviar(mensagem) {
  mensagem = mensagem.trim();
  if (!mensagem) return;
  const etapa = atual;
  $("entrada").value = "";
  $("enviar").disabled = true;
  adicionar(etapa, { tipo: "voce", texto: mensagem });
  const pastas = etapa === "todas" ? PASTAS : [etapa];
  const resultados = await Promise.all(pastas.map(p =>
    perguntar(p, mensagem).then(d => ({ p, d })).catch(e => ({ p, erro: e }))));
  for (const { p, d, erro } of resultados) {
    const pasta = etapa === "todas" ? p : null;
    if (erro) {
      adicionar(etapa, { tipo: "aviso", texto: `Não consegui falar com o servidor (${NOME_PASTA[p]}). Ele está rodando? (java web/Servidor.java)` });
      continue;
    }
    for (const r of d.respostas) adicionar(etapa, { tipo: "bot", bot: r.bot, texto: r.texto, pasta });
    if (d.aviso) adicionar(etapa, { tipo: "aviso", texto: (pasta ? NOME_PASTA[p] + ": " : "") + d.aviso });
  }
  $("enviar").disabled = false;
  $("entrada").focus();
}

$("form").onsubmit = e => { e.preventDefault(); enviar($("entrada").value); };
$("limpar").onclick = () => { historico[atual] = []; mostrar(); };
montarEtapas();
mostrar();
</script>
</body>
</html>
